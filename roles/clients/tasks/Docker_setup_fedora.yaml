# from https://github.com/tomhn0808/ansible-role-docker_install_fedora/tree/main
- name: Install dnf-plugins-core
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present
  become: true
  when: ansible_facts['os_family']|lower == 'redhat'

- name: Download the Docker repository RPM
  ansible.builtin.get_url:
    url: "{{ rpm_repository_url }}"
    dest: /etc/yum.repos.d/docker-ce.repo # Save the .repo file directly
    mode: '0644'
    checksum: "sha256:{{ rpm_repository_sha256checksum }}"
  become: true
  when: ansible_facts['os_family']|lower == 'redhat'

- name: Ensure the GPG key is imported (handled by dnf by default)
  ansible.builtin.rpm_key:
    state: present
    key: "{{ docker_fedora_gpg_key_url }}"
  become: true
  when: ansible_facts['os_family']|lower == 'redhat'

- name: Install Docker engine
  ansible.builtin.package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true
  when: ansible_facts['os_family']|lower == 'redhat'

- name: Start and enable Docker Engine service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when:
    - ansible_virtualization_type != "docker" # Don't enable inside Docker (no Systemd in docker)
    - ansible_facts['os_family']|lower == 'redhat'
  become: true

- name: Install Docker Python module
  ansible.builtin.package:
    name: python3-docker
    state: present
  become: true
  when: ansible_facts['os_family']|lower == 'redhat'

- name: Add to docker group
  ansible.builtin.user:
    name: "cody"
    groups: docker
    append: true
  become: true
  when: ansible_facts['os_family']|lower == 'redhat'
