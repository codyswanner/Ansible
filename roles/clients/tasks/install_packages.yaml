- name: install flatpak packages
  community.general.flatpak:
    name:
      - app/fm.reaper.Reaper/x86_64/stable
      - app/re.sonny.Eloquent/x86_64/stable
      - com.discordapp.Discord
      - com.heroicgameslauncher.hgl
      - com.moonlight_stream.Moonlight
      - com.obsproject.Studio
      - com.vscodium.codium
      - org.gimp.GIMP
      - org.kde.krita
      - org.mozilla.firefox
      - org.musescore.MuseScore
      - org.signal.Signal
      - org.shotcut.Shotcut
  become: true

- name: copy AppImages
  ansible.builtin.copy:
    src: ~/Documents/Installations/AppImages/
    dest: /home/cody/Documents/Installations/AppImages/
    owner: cody
    group: cody
    mode: 0500
  become: true
