- name: install dnf packages
  ansible.builtin.dnf:
    name:
      - curl
      - flatpak
      - git
      - jack-audio-connection-kit
      - net-tools
      - nfs-utils
      - openssh-clients
      - picard
      - pipewire-plugin-jack
      - qjackctl
      - steam # requires RPM Fusion
      - traceroute
      - waydroid
      - wget
      - wireguard-tools
      # Proton Pass and VPN not in dnf repositories
    state: present
  when: ansible_facts['os_family']|lower == 'redhat'
  become: true

- name: install apt packages
  ansible.builtin.apt:
    name:
      - android-sdk-platform-tools-common
      - curl
      - default-libmysqlclient-dev
      - docker-buildx-plugin
      - docker-ce-cli
      - docker-ce
      - docker-compose-plugin
      - flatpak
      - git
      - gnome-multi-writer
      - jackd2
      - language-pack-en
      - nfs-common
      - openoffice.org-hyphenation
      - openssh-client
      - picard
      - pipewire-jack
      - proton-pass
      - proton-vpn-gnome-desktop
      - protonvpn-stable-release
      - python-is-python3
      - qjackctl
      - solaar
      - steam-launcher
      - traceroute
      - wakeonlan
      - waydroid
      - wget
      - wireguard
      - 'https://proton.me/download/PassDesktop/linux/x64/ProtonPass.deb'
  when: ansible_facts['os_family']|lower == 'debian'
  become: true

