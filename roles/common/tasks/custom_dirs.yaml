- name: create custom directories
  ansible.builtin.file:
    path: "{{item}}"
    state: directory
    owner: cody
    group: cody
  loop: "{{custom_dirs}}"
  become: true

# /mnt/nfs cannot be chown'd, so run it separately
- name: create /mnt/nfs
  ansible.builtin.file:
    path: "/mnt/nfs"
    state: directory
  become: true
